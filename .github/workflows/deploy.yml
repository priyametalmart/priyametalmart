# Builds the storefront from live Shopify data and deploys it to Cloudflare Pages.
#
# Runs on every push to main, every hour (so edits made in Shopify go live on their own),
# on demand from the Actions tab, and when Shopify Flow sends a "shopify-update" event.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SHOPIFY_STOREFRONT_PUBLIC_TOKEN
#   Variables: SHOPIFY_STORE_DOMAIN, SITE_URL and SITE_INDEXABLE (optional, set at launch)
name: Deploy storefront

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [shopify-update]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build from Shopify
        run: npm run build
        env:
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_PUBLIC_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy out --project-name priyametalmart --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
